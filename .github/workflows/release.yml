name: Release

# Push a tag like v0.2.0 (matching __version__ in src/parquetry/__init__.py) to
# build standalone bundles for Linux, Windows and macOS plus the Python wheel
# and sdist, and publish them as a GitHub release. Run the workflow manually to
# build the artifacts without publishing a release.
#
# The macOS builds are signed with a Developer ID certificate and notarized by
# Apple when the signing secrets are set (see docs/macos-notarization.md).
# Tagged releases fail without them; manual runs then build unsigned bundles.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dist:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/parquetry/__init__.py').read_text()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Apple's notary service usually takes a few minutes per upload, sometimes longer.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the bundle runs on newer glibc versions too.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - name: Require signing for macOS releases
        if: runner.os == 'macOS' && env.MACOS_SIGNING != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::The MACOS_CERTIFICATE_P12 secret is not set, so the release cannot be signed and notarized. See docs/macos-notarization.md."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        # The xcb helper libraries get bundled, so the app also starts on
        # desktops that do not have them installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Import signing certificate and notary key (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          for name in MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set. See docs/macos-notarization.md."
              exit 1
            fi
          done

          # A temporary keychain that codesign can use without a password prompt
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          # Sign with the certificate's SHA-1 hash so the name does not matter
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found = 1 }')
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::MACOS_CERTIFICATE_P12 does not contain a Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/notary_key.p8"; then
            echo "::error::APPLE_API_KEY_P8 must contain the text of the AuthKey_<id>.p8 file."
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[package]"

      # Signs the macOS bundle when MACOS_CODESIGN_IDENTITY is set
      - name: Build bundle
        run: pyinstaller packaging/parquetry.spec --noconfirm

      - name: Smoke test
        run: python packaging/smoke_test.py dist

      # Staples the ticket to the app itself, so it also opens offline after
      # being copied out of the disk image.
      - name: Notarize app (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python packaging/macos/notarize.py dist/Parquetry.app

      - name: Package
        run: python packaging/package.py dist artifacts

      - name: Notarize disk image (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python packaging/macos/notarize.py artifacts/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Remove signing keychain and notary key (macOS)
        if: always() && env.MACOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$MACOS_KEYCHAIN"
          rm -f "$APPLE_API_KEY_PATH"

  publish:
    name: publish GitHub release
    needs: [python-dist, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
